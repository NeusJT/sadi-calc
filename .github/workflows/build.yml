name: CI Android Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip python3-venv autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev cython3

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install --upgrade buildozer cython

      - name: Preinstall Android Build Tools (Fix Aidl)
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools
          export ANDROIDSDK="$HOME/.buildozer/android/platform/android-sdk"
          export PATH="$ANDROIDSDK/cmdline-tools/latest/bin:$ANDROIDSDK/platform-tools:$PATH"
          mkdir -p ~/.android
          echo "" | android create avd --force -n test -t android-21 2>/dev/null || true
          yes | sdkmanager --licenses 2>/dev/null || true
          yes | buildozer android debug --require-package --no-build 2>&1 || true

      - name: Build with Buildozer
        run: yes | buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sadi-apk
          path: bin/*.apk
